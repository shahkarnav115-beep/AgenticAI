name: Build and Release AgenticAI Setup

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: llvm/actions/install-ninja@main

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build AgenticAI
        run: |
          cmake --build build --config Release

      - name: Prepare Staging Distribution Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          
          # Find and copy AgenticAI executable
          $appExe = Get-ChildItem -Path build -Recurse -Filter "AgenticAI.exe" | Select-Object -First 1
          if ($appExe) {
              Write-Host "Found AgenticAI.exe at: $($appExe.FullName)"
              Copy-Item $appExe.FullName -Destination dist/
          } else {
              Write-Error "AgenticAI.exe not found in build directory!"
              exit 1
          }

          # Find and copy llama-server executable if present
          $llamaExe = Get-ChildItem -Path build -Recurse -Filter "llama-server.exe" | Select-Object -First 1
          if ($llamaExe) {
              Write-Host "Found llama-server.exe at: $($llamaExe.FullName)"
              Copy-Item $llamaExe.FullName -Destination dist/
          }

          # Run windeployqt automatically to bundle Qt DLLs & plugins
          windeployqt --no-compiler-runtime --dir dist dist/AgenticAI.exe

      - name: Build Inno Setup Installer
        shell: cmd
        run: |
          iscc installer.iss

      - name: Create GitHub Release and Upload Installer
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: Output/AgenticAI-Setup.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
